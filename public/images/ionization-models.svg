<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Model partikel elektrolit kuat, lemah, dan nonelektrolit</title>
  <desc id="desc">Kotak pertama didominasi ion, kotak kedua memiliki campuran molekul dan ion, kotak ketiga hanya berisi molekul netral.</desc>
  <rect width="720" height="380" rx="28" fill="#f3f8fc"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="125" y="48" fill="#203864" font-size="21" font-weight="700">Elektrolit kuat</text>
    <text x="360" y="48" fill="#203864" font-size="21" font-weight="700">Elektrolit lemah</text>
    <text x="595" y="48" fill="#203864" font-size="21" font-weight="700">Nonelektrolit</text>
  </g>
  <g fill="#dceeff" stroke="#203864" stroke-width="4">
    <rect x="30" y="75" width="190" height="235" rx="18"/>
    <rect x="265" y="75" width="190" height="235" rx="18"/>
    <rect x="500" y="75" width="190" height="235" rx="18"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="80" cy="130" r="22" fill="#16a6a1"/><text x="80" y="137" fill="white">+</text>
    <circle cx="165" cy="145" r="22" fill="#203864"/><text x="165" y="152" fill="white">−</text>
    <circle cx="125" cy="200" r="22" fill="#203864"/><text x="125" y="207" fill="white">−</text>
    <circle cx="75" cy="260" r="22" fill="#16a6a1"/><text x="75" y="267" fill="white">+</text>
    <circle cx="170" cy="265" r="22" fill="#16a6a1"/><text x="170" y="272" fill="white">+</text>
    <circle cx="320" cy="140" r="21" fill="#16a6a1"/><text x="320" y="147" fill="white">+</text>
    <circle cx="395" cy="255" r="21" fill="#203864"/><text x="395" y="262" fill="white">−</text>
    <rect x="300" y="190" width="90" height="38" rx="19" fill="#8a6dce"/><text x="345" y="216" fill="white" font-size="16">molekul</text>
    <rect x="530" y="135" width="100" height="40" rx="20" fill="#8a6dce"/><text x="580" y="162" fill="white" font-size="16">molekul</text>
    <rect x="545" y="215" width="100" height="40" rx="20" fill="#8a6dce"/><text x="595" y="242" fill="white" font-size="16">molekul</text>
  </g>
  <g fill="#5a6679" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">
    <text x="125" y="345">Hampir semua menjadi ion</text>
    <text x="360" y="345">Hanya sebagian menjadi ion</text>
    <text x="595" y="345">Partikel tetap netral</text>
  </g>
</svg>
